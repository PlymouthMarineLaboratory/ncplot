name: Tests

# Plots a small subset of each CMIP6 grid layout and of an FVCOM mesh
# (tests/data, made by tests/make_test_data.py) with ncplot.view.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py

      # cartopy downloads Natural Earth's coastlines the first time it draws
      # them: keep them between runs (the tests skip if they cannot be had)
      - name: Cache Natural Earth coastlines
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: natural-earth-v1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest -v
